name: Collect Fontstats

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated list of country script names (e.g. norway,sweden,denmark)'
        required: false
        default: 'norway,sweden,denmark'
  schedule:
    # Norway local 09:01 — handle DST by scheduling two UTC times:
    # Mar-Oct (CEST, UTC+2) -> 07:01 UTC
    - cron: '1 7 * 3-10 *'
    # Nov-Feb (CET, UTC+1) -> 08:01 UTC
    - cron: '1 8 * 11,12,1,2 *'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run collectors
        run: |
          set -euo pipefail
          IFS=',' read -ra C <<< "${{ github.event.inputs.countries }}"
          for c in "${C[@]}"; do
            trimmed=$(echo "$c" | xargs)
            if [ -n "$trimmed" ]; then
              php "fontstats/${trimmed}.php"
            fi
          done
      - name: Persist JSON to branch
        env:
          BRANCH: fontstats-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B "$BRANCH"
          git add -f fontstats/output/*.json || true
          git commit -m "fontstats: update data (${GITHUB_RUN_ID})" || echo "no changes to commit"
          git push --force origin "$BRANCH"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fontstats/output
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fontstats-json
          path: fontstats/output/*.json
